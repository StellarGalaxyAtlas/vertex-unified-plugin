# Settings for the tests and the linter only: StreamController loads the
# plugin from main.py and manifest.json, not from this file.

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["assets/icons/source"]   # one-off drawing scripts

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "SIM105"]

[tool.ruff.lint.isort]
known-first-party = ["vertex"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
